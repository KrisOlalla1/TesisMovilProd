name: monitoreo_movil
description: App móvil de paciente para monitoreo de salud (login, signos, calendario, notificaciones, LLM)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Arquitectura / Estado / Router
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # HTTP + Auth
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  jwt_decode: ^0.3.1

  # UI
  table_calendar: ^3.1.2
  intl: ^0.19.0

  # Notificaciones y TZ
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # Utils
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
